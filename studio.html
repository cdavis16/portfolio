  <style>
    body { background: #3d3d3d; --bg: #3d3d3d; }

    /* Immersive scroll-snap */
    html {
      scroll-snap-type: y proximity;
      scroll-behavior: smooth;
    }

    /* Invert nav */
    .nav {
      background: rgba(61, 61, 61, 0.75) !important;
    }
    .nav__logo { color: #fff !important; }
    .nav__toggle-line { background: #fff !important; }
    .nav__links a { color: rgba(255,255,255,0.6) !important; }
    .nav__links a:hover { color: #fff !important; }
    .nav__links a.active { color: #fff !important; }

    /* Invert footer */
    .footer__copy { color: rgba(255,255,255,0.5) !important; }
    .footer__links a { color: rgba(255,255,255,0.5) !important; }
    .footer__links a:hover { color: #fff !important; }

    /* Invert cursor */
    .cursor__dot { background: #fff !important; }

    /* Invert dropdown */
    .nav__dropdown { background: rgba(61, 61, 61, 0.95) !important; }
    .nav__dropdown a { color: rgba(255,255,255,0.6) !important; }
    .nav__dropdown a:hover { color: #fff !important; }

    /* Top grid, 3 columns */
    .playground-grid--top {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 60px 4px;
      padding: 80px var(--gutter) 0;
      align-items: start;
      min-height: 100vh;
      padding-bottom: 80px;
      scroll-snap-align: start;
    }

    .playground-grid--top .playground-grid__item:nth-child(1)  { margin-top: 0; }
    .playground-grid--top .playground-grid__item:nth-child(2)  { margin-top: 100px; }
    .playground-grid--top .playground-grid__item:nth-child(3)  { margin-top: 40px; }
    .playground-grid--top .playground-grid__item:nth-child(4)  { margin-top: 70px; }
    .playground-grid--top .playground-grid__item:nth-child(5)  { margin-top: 0; }
    .playground-grid--top .playground-grid__item:nth-child(6)  { margin-top: 120px; }
    .playground-grid--top .playground-grid__item:nth-child(7)  { margin-top: 30px; }
    .playground-grid--top .playground-grid__item:nth-child(8)  { margin-top: 90px; }
    .playground-grid--top .playground-grid__item:nth-child(9)  { margin-top: 0; }

    /* Bottom grid, 5 columns */
    .playground-grid--bottom {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 60px 4px;
      padding: 60px var(--gutter) 0;
      align-items: start;
      min-height: 100vh;
      padding-bottom: 80px;
      scroll-snap-align: start;
    }

    .playground-grid--bottom .playground-grid__item:nth-child(1)  { margin-top: 30px; }
    .playground-grid--bottom .playground-grid__item:nth-child(2)  { margin-top: 100px; }
    .playground-grid--bottom .playground-grid__item:nth-child(3)  { margin-top: 10px; }
    .playground-grid--bottom .playground-grid__item:nth-child(4)  { margin-top: 60px; }
    .playground-grid--bottom .playground-grid__item:nth-child(5)  { margin-top: 120px; }
    .playground-grid--bottom .playground-grid__item:nth-child(6)  { margin-top: 0; }
    .playground-grid--bottom .playground-grid__item:nth-child(7)  { margin-top: 80px; }
    .playground-grid--bottom .playground-grid__item:nth-child(8)  { margin-top: 50px; }
    .playground-grid--bottom .playground-grid__item:nth-child(9)  { margin-top: 130px; }
    .playground-grid--bottom .playground-grid__item:nth-child(10) { margin-top: 15px; }
    .playground-grid--bottom .playground-grid__item:nth-child(11) { margin-top: 95px; }
    .playground-grid--bottom .playground-grid__item:nth-child(12) { margin-top: 45px; }

    .playground-grid__item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
      border-radius: var(--radius-lg);
    }

    /* Varied transition durations for organic feel */
    .playground-grid__item:nth-child(even) { transition-duration: 1.1s; }
    .playground-grid__item:nth-child(3n) { transition-duration: 1.3s; }


    .playground-grid__item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playground-grid__item--scaled video {
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 8px;
      padding: 8%;
    }

    .playground-grid__item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playground-grid__item--wide {
      grid-column: span 2;
    }

    .playground-grid__item--contain img {
      object-fit: contain;
      padding: 8%;
    }

    /* Sticky info box */
    .playground-info {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 99;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 16px 24px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8125rem;
      font-weight: 300;
      line-height: 1.5;
      max-width: 280px;
    }

    @media (max-width: 768px) {
      .playground-grid--top,
      .playground-grid--bottom {
        grid-template-columns: repeat(2, 1fr);
      }
      .playground-info {
        bottom: 16px;
        left: 16px;
        right: 16px;
        max-width: none;
      }
    }
  </style>
</head>
